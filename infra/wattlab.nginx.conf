# /etc/nginx/sites-available/wattlab
# WattLab — Greening of Streaming
# HTTP: redirect to HTTPS once cert is live.
# Until cert exists, comment out the return 301 line and use the proxy block directly.

# Rate limiting: 4 job submissions per minute per IP, burst of 2
limit_req_zone $binary_remote_addr zone=wattlab_submit:10m rate=4r/m;
# Max 3 simultaneous connections per IP
limit_conn_zone $binary_remote_addr zone=wattlab_conn:10m;

server {
    server_name wattlab.greeningofstreaming.org;

    # Allow video uploads up to 2GB (FastAPI enforces 1GB; this must be >= that)
    client_max_body_size 2g;

    # ACME challenge (Let's Encrypt HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS (uncomment once cert is issued)
    # return 301 https://$host$request_uri;

    # CR-011 — maintenance-page swap. Triggered by presence of
    # /tmp/owl-maintenance (raised by bin/stage-on, lowered by bin/stage-off).
    error_page 503 @maintenance;
    location @maintenance {
        root /home/gos/wattlab/wattlab_service/static;
        rewrite ^.*$ /maintenance.html break;
        internal;
    }

    # Serve /static/* directly from disk so the maintenance page's owl.svg
    # loads even while FastAPI is restarting. Also a small perf win in
    # normal operation (nginx beats proxying through uvicorn for tiny
    # files). Pairs with the gos-group membership step (so www-data can
    # traverse /home/gos to reach this dir).
    location /static/ {
        root /home/gos/wattlab/wattlab_service;
        access_log off;
    }

    # /ui-config.js — tiny per-request window.WL_CFG payload fetched by every
    # page (Phase 1, S41). Exempt from limit_conn: it loads in parallel with
    # /static bundles and JSON polls, and counting it toward the per-IP cap
    # produced the first-ever homepage 429 (2026-06-10).
    location = /ui-config.js {
        if (-f /tmp/owl-maintenance) {
            return 503;
        }
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Rate-limit job submission endpoints (+ anonymous findings feedback POST —
    # edge 4r/m per IP, defence-in-depth on top of the app's per-subnet limit
    # and global daily cap)
    location ~ ^/(video/use-source|video/upload|llm/run|llm/run-all|image/start|findings/feedback)$ {
        if (-f /tmp/owl-maintenance) {
            return 503;
        }
        limit_req zone=wattlab_submit burst=2 nodelay;
        limit_conn wattlab_conn 3;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location / {
        if (-f /tmp/owl-maintenance) {
            return 503;
        }
        # 6 (was 3): HTTP/1.1 browsers open up to 6 parallel connections; with
        # page HTML + JSON polls in flight the old cap 429'd legitimate page
        # loads (first seen 2026-06-10).
        limit_conn wattlab_conn 6;
        limit_conn_status 429;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wattlab.greeningofstreaming.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wattlab.greeningofstreaming.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

