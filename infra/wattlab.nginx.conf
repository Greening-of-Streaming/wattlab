server {
    if ($host = wattlab.greeningofstreaming.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wattlab.greeningofstreaming.org;
    return 404; # managed by Certbot


}
