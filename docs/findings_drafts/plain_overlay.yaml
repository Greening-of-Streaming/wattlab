# DRAFT plain-language overlay for the /findings redesign mockup (2026-10-16).
# Read by routes_mockup_findings.py only. Ben edits wording here; once approved,
# these fields move into each finding's frontmatter (Phase 2) and this file goes.
#
# Wording rule (Cochrane/GRADE-style): the verb follows the evidence.
#   main shelf, 🟢  → plain statement ("uses", "costs")
#   main shelf, 🟡  → "appears to" / "probably"
#   early signal (n < 3) → "may" / "in a first test"; no headline number shown
#
# n_runs = smallest repeat count behind the headline comparison, read from each
# finding's caveats (Claude's reading 2026-10-16 — VERIFY before Phase 2).
# Fields: plain_headline, plain_summary, key_number, theme, tags, n_runs, n_note
# draft: true = the finding lives in docs/findings_drafts/ (shown with a Draft badge).
#
# 2026-11-06 (CR-086, WattLab call 5 Nov) adds, per slug:
#   stages          workflow stages from taxonomy.yaml `stage` (one or more)
#   review_status   machine-draft | lab-checked | group-validated | not-reproduced
#                   (a separate axis from the 🟢🟡🔴 measurement confidence).
#                   Only a WattLab meeting moves a finding to group-validated;
#                   record it as validated_on: YYYY-MM-DD.
#   review_note     why the status is what it is (Lab review queue only)
#   n_check         result of checking n_runs against the cited results (Lab queue only)
#   why_it_matters  1–2 sentences for a business reader. DRAFTED BY CLAUDE
#                   2026-11-06 from each finding's own "Why this matters"; Ben to edit.
#   quiz            {question, options, answer, explain}, required on every finding;
#                   facts only from the finding itself. The correct option may be listed
#                   anywhere: the page shuffles the order. Early signals (n < 3) test
#                   direction only, with no measured quantity anywhere in the quiz, and
#                   the explanation says how thin the evidence is. DRAFTED BY CLAUDE
#                   2026-11-08 for the 13 findings that had none; Ben to edit.
#
# n_runs checked 2026-11-06 against the cited result JSON: decode findings match
# their stated n except the Apple TV one (see its n_check). Video, LLM, image and
# enhance findings cite single runs, consistent with their n=1/n=2 entries.

tv-screen-draws-20x-the-streaming-box:
  draft: true
  plain_headline: The TV screen uses more than 20 times the power of the streaming box feeding it
  plain_summary: >-
    On a 55-inch OLED fed by Google's streaming box, the screen drew 50–57 W and the box about 2 W.
    Whatever the picture format, the box was only 3–5 % of what the pair drew at the wall — so choices
    that only touch the box act on a small slice of the energy.
  key_number: 21–29× the box
  theme: where
  tags: [where:home-device, hardware:tv, hardware:streaming-box, lever:device-type, lever:resolution-hdr]
  n_runs: 3
  n_note: n=3 per arm, six picture-format arms
  stages: [screen, home-device]
  review_status: machine-draft
  why_it_matters: >-
    Most debate about streaming energy is about the stream: codecs, bitrate, resolution. In the home, the screen is where nearly all the power goes, so that is where savings are largest.
  quiz:
    question: "A streaming box plays into a 55-inch OLED TV. What share of the pair's power does the box use?"
    options: ["About half", "About a quarter", "Less than 5 %"]
    answer: "Less than 5 %"
    explain: "The box drew about 2 W and the screen 50–57 W: the box was 3–5 % of the pair."

tv-picture-mode-outweighs-streaming-choices:
  draft: true
  plain_headline: A TV's "Vivid" picture mode adds about 40 % to its power — more than every streaming choice combined
  plain_summary: >-
    Switching our OLED TV from Standard to Vivid or Sports added about 20 W while watching football
    (+39 %) and about 10 W on adverts. The mode labelled Eco saved nothing. The streaming box feeding it
    stayed at under 2 W throughout.
  key_number: +20 W (+39 %)
  theme: where
  tags: [where:home-device, hardware:tv, lever:settings, lever:content]
  n_runs: 3
  n_note: n=3 per mode (one ad-break cell n=2)
  stages: [screen]
  review_status: machine-draft
  why_it_matters: >-
    A picture setting the viewer can change in seconds outweighs every choice the streaming industry argues about. Device defaults and viewer guidance may be the cheapest lever there is.
  quiz:
    question: "While watching football, which adds more power: switching the TV to Vivid mode, or switching the stream from HD to 4K?"
    options: ["Vivid mode", "The 4K stream", "About the same"]
    answer: "Vivid mode"
    explain: "Vivid added about 20 W at the TV. 4K added 0.3–1.1 W at the box and nothing measurable at the screen."

hdr-costs-the-screen-4k-costs-the-box:
  draft: true
  plain_headline: HDR costs energy at the screen; 4K costs it at the box — and the screen's share is ten times bigger
  plain_summary: >-
    HDR made our OLED TV draw about 4 W more (7–8 %) while six of seven boxes didn't notice it. 4K
    made every box draw 0.3–1.1 W more, and the screen nothing measurable.
  key_number: HDR +4 W · 4K +0.3–1.1 W
  theme: myths
  tags: [where:home-device, hardware:tv, hardware:streaming-box, hardware:apple-tv, lever:resolution-hdr]
  n_runs: 3
  n_note: n=3 per box and format, seven boxes
  stages: [screen, home-device]
  review_status: machine-draft
  why_it_matters: >-
    HDR and 4K are often lumped together as 'premium formats'. Their energy cost lands in different places, and the HDR cost at the screen is about ten times the 4K cost at the box.
  quiz:
    question: "HDR or 4K: which one costs energy mainly at the screen?"
    options: ["HDR", "4K", "Both equally"]
    answer: "HDR"
    explain: "HDR added about 4 W at the TV. 4K added 0.3–1.1 W at the box and nothing measurable at the screen."

bitrate-barely-moves-box-playback-power:
  draft: true
  plain_headline: Raising the bitrate 128-fold raises a TV box's power by only 15–26 %
  plain_summary: >-
    Four streaming boxes played the same clip from 0.25 to 32 Mb/s. Their power rose in a straight line,
    by 0.3–0.5 W in total — tenths of a watt, not a share of "streaming energy". The network side is
    not included.
  key_number: +0.3–0.5 W over 128×
  theme: myths
  tags: [where:home-device, hardware:streaming-box, lever:bitrate, codec:h264]
  n_runs: 3
  n_note: n=3 per rung, seven rungs, four boxes
  stages: [home-device]
  review_status: machine-draft
  why_it_matters: >-
    Lowering the bitrate is often sold as an energy saving for viewers' devices. At the box it saves tenths of a watt, with no sweet spot; any case for lower bitrate rests on the network, not the device.
  quiz:
    question: "A TV box plays the same clip at 128 times the bitrate. How much more power does it draw?"
    options: ["Less than half a watt", "About 5 W", "Twice as much"]
    answer: "Less than half a watt"
    explain: "Power rose in a straight line by 0.3–0.5 W in total from 0.25 to 32 Mb/s."

hw-decoder-cuts-client-energy-4x:
  plain_headline: A chip built for video plays it on about a quarter of the power software needs in non-specialized hardware
  plain_summary: >-
    On the same small computer, playing a film through its dedicated video chip added 0.41 W;
    doing the same job in software added 1.50 W. The chip only helps if the software can reach
    it — and with no chip at all, the newest format (AV1) couldn't play smoothly.
  key_number: 3.7× less power
  theme: devices
  tags: [where:home-device, lever:hw-vs-sw, hardware:raspberry-pi, hardware:streaming-box, codec:h264, codec:av1]
  n_runs: 3
  n_note: n=3–6 per arm, same board
  stages: [home-device]
  review_status: lab-checked
  review_note: >-
    Marked lab-reviewed in CLAUDE.md (protocol v3 replication, 2026-08-09).
  why_it_matters: >-
    Decode energy is paid by every viewer, every hour. A device generation that drops a video chip, or software that cannot reach it, can roughly quadruple that cost without showing up on any spec sheet.
  quiz:
    question: "On the same small computer, how does playing a film through its video chip compare with doing it in software?"
    options: ["About a quarter of the power", "About the same", "Twice the power"]
    answer: "About a quarter of the power"
    explain: "The chip added 0.41 W, software 1.50 W: 3.7× less."

appletv-a10x-av1-vp9-software-fallback:
  plain_headline: A 2017 Apple TV uses about 30% more power for the newer video formats its chip wasn't built for
  plain_summary: >-
    H.264 and HEVC play at the same power (about 4.1 W). AV1 and VP9, which this chip can't
    decode in hardware, cost about 1.2 W more because the main processor does the work instead.
  key_number: +29% (+1.2 W)
  theme: myths
  tags: [where:home-device, lever:hw-vs-sw, lever:codec, hardware:apple-tv, codec:h264, codec:hevc, codec:av1, codec:vp9]
  n_runs: 3
  n_note: n=3 per format, three kinds of content (one cell n=2)
  stages: [home-device]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  n_check: >-
    Claim is n=3 per codec per content (about 36 runs), but source_result_ids cite only 8 single-run results. Link the remaining runs before group validation.
  why_it_matters: >-
    Sending a newer, more efficient format to an older device can cost energy at the viewer's end. A codec is only cheap to watch on hardware built to decode it.
  quiz:
    question: "On a 2017 Apple TV, which uses more power: H.264 or AV1?"
    options: ["H.264", "AV1", "The same"]
    answer: "AV1"
    explain: "AV1 cost about 1.2 W more (+29 %), because this chip decodes it in software."

looped-excerpt-measures-as-continuous:
  plain_headline: Testing with a looped 2-minute clip gives the same reading as playing the full programme
  plain_summary: >-
    On four TV boxes, a 2-minute excerpt played on repeat measured the same as the continuous
    original. A shorter 30-second loop added a small bias (up to +4%) on one box — so our tests
    use 2-minute loops.
  key_number: within 0.02 W
  theme: trust
  tags: [where:home-device, lever:test-design, hardware:streaming-box, codec:h264]
  n_runs: 3
  n_note: n=3 paired passes per box
  stages: [method]
  review_status: machine-draft
  why_it_matters: >-
    Other labs can test with a short looped clip instead of a full programme and still get a comparable number. That makes tests faster, cheaper and easier to repeat.
  quiz:
    question: "Does a 2-minute clip on repeat give a different power reading from the full programme?"
    options: ["No, the same within 0.02 W", "Yes, about 20 % higher", "Yes, about 20 % lower"]
    answer: "No, the same within 0.02 W"
    explain: "On four TV boxes the 2-minute loop matched the continuous programme. A 30-second loop added up to 4 % on one box."

streaming-box-plays-4-7x-cheaper-than-general-purpose:
  plain_headline: A purpose-built streaming box may play video far more cheaply than a small general-purpose computer — but not every cheap box does
  plain_summary: >-
    Playing the same clip with a screen attached, Google's streaming box added +0.30 W against
    +1.32 to +2.03 W on Raspberry Pi boards, even when the Pi used its own video chip. A no-brand
    TV box was only modestly better than the Pi, so "streaming box" is not an efficiency class.
  key_number: 4–7× less extra power
  theme: devices
  tags: [where:home-device, lever:device-type, hardware:streaming-box, hardware:raspberry-pi, codec:h264]
  n_runs: 1
  n_note: single paired read per device (GTV n=2 in the W5 comparison) — verify
  stages: [home-device]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    Choosing the playback device can matter more than any stream setting. But the label 'streaming box' does not guarantee efficiency; each device has to be measured.
  quiz:
    question: "In a first test, playing the same clip with a screen attached, which added the least power?"
    options: ["Google's streaming box", "A Raspberry Pi using its video chip", "A Raspberry Pi in software"]
    answer: "Google's streaming box"
    explain: "Google's box added far less, even against the Pi's own video chip. A no-brand TV box was only modestly better than the Pi, so \"streaming box\" is not an efficiency class. One paired reading per device."

stb-decode-and-play-content-over-codec:
  plain_headline: On modern TV boxes, what you watch may matter more for power than the video format it arrives in
  plain_summary: >-
    An hour of HD playback on two current streaming boxes added about 0.25–0.65 W over the home
    screen. Switching content moved that by about 0.35 W; switching the video format by 0.1 W
    or less.
  key_number: content ≈0.35 W vs format ≤0.1 W
  theme: myths
  tags: [where:home-device, lever:content, lever:codec, hardware:streaming-box, codec:h264, codec:hevc, codec:av1]
  n_runs: 1
  n_note: n=1 per box × content × format cell (one cell n=3)
  stages: [home-device]
  review_status: machine-draft
  why_it_matters: >-
    If what is on screen moves a box's power more than the codec does, codec choice is a weak energy lever on modern boxes. Energy claims should name the content they were measured on.
  quiz:
    question: "On two modern TV boxes, what may move playback power more?"
    options: ["What you watch", "The video format it arrives in", "Neither moved it"]
    answer: "What you watch"
    explain: "Changing the content moved power more than changing the format. Most combinations were measured once, and a third box has since shown a clear format effect."

codec-decode-energy-depends-on-silicon-and-regime:
  plain_headline: There may be no single "greenest" video format — it depends on the chip doing the work
  plain_summary: >-
    On one streaming box the formats were indistinguishable; on another, the older H.264 cost
    about 11% more; in software the spread reached about 60%. Even the way you run the test can
    flip the ranking.
  key_number: 0 to ~60% spread
  theme: myths
  tags: [where:home-device, lever:codec, lever:device-type, hardware:streaming-box, hardware:raspberry-pi, codec:h264, codec:hevc, codec:av1, codec:vp9]
  n_runs: 1
  n_note: n=1–3 per cell (software panels mostly n=1)
  stages: [home-device]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    Any claim that one codec is 'the green codec' needs to name the device. Ranking formats without naming the chip can point an operator the wrong way.
  quiz:
    question: "Which video format may be the cheapest to play?"
    options: ["It depends on the chip doing the work", "AV1, on every device", "H.264, on every device"]
    answer: "It depends on the chip doing the work"
    explain: "On one box the formats were indistinguishable, on another H.264 cost more, and in software the spread was wider. Even the test method can flip the ranking."

abr-all-codecs-meridian-120s:
  plain_headline: Encoding video on a graphics card may use 2–4× less energy than on the main processor
  plain_summary: >-
    On one 2-minute clip, every format we tried (H.264, HEVC, AV1) took 2–4.4× less energy on the
    graphics card than in software. HEVC on the graphics card produced the cheapest file.
  key_number: 2–4.4× less energy
  theme: preparing
  tags: [where:server, lever:hw-vs-sw, lever:codec, hardware:amd-gpu, hardware:desktop-cpu, codec:h264, codec:hevc, codec:av1]
  n_runs: 1
  n_note: n=1 (single full-length run on disk)
  stages: [encode]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    Encoding is paid once per title, but large libraries and live channels encode constantly. Moving that work to a graphics card could cut server energy severalfold.
  quiz:
    question: "On one short clip, where did encoding the video take less energy?"
    options: ["On the graphics card", "On the main processor", "No difference"]
    answer: "On the graphics card"
    explain: "Every format tried (H.264, HEVC, AV1) used less energy on the graphics card. One run each, on one clip."

av1-hw-sw-vmaf-tradeoff:
  plain_headline: A dedicated AV1 encoding chip may halve the energy, at a small cost in picture quality and file size
  plain_summary: >-
    Hardware AV1 encoding used about 55% less energy than software, but scored about 2 points
    lower on a standard picture-quality scale (VMAF) and produced a file about 40% larger.
  key_number: −55% energy, −2 VMAF, +40% size
  theme: preparing
  tags: [where:server, lever:hw-vs-sw, hardware:amd-gpu, hardware:desktop-cpu, codec:av1]
  n_runs: 1
  n_note: n=1 (same run as the all-formats finding)
  stages: [encode]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    Hardware encoding saves server energy, but a slightly larger file at slightly lower quality is then delivered to every viewer. The saving has to be weighed against that.
  quiz:
    question: "In a first test, what did a dedicated AV1 encoding chip give up to save energy?"
    options: ["A little picture quality and a larger file", "Nothing at all", "Much longer encoding time"]
    answer: "A little picture quality and a larger file"
    explain: "The chip used much less energy than software and finished sooner, but scored slightly lower on a quality scale and made a larger file. One run."

gpu-boost-overclocks-fixed-function-nvenc:
  plain_headline: Switching off a graphics card's automatic speed boost may cut video-encoding energy by about a tenth, with no loss of quality
  plain_summary: >-
    NVIDIA's automatic boost pushes the card faster than the video encoder can use. Capping the
    clock saved about 9% of the energy for the same picture quality and nearly the same time —
    and made our readings repeatable across reboots and room temperature.
  key_number: −9% energy, same quality
  theme: preparing
  tags: [where:server, lever:settings, hardware:nvidia-gpu, codec:h264]
  n_runs: 2
  n_note: n=2 per clock setting (after a discarded warm-up)
  stages: [encode]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    A default setting nobody chose may be wasting energy on every encode. Capping it is free and costs no quality, which makes it an easy recommendation if the result holds.
  quiz:
    question: "What may switching off a graphics card's automatic speed boost do to video encoding?"
    options: ["Save some energy at the same quality", "Save energy but lower the quality", "Use more energy, because encoding takes longer"]
    answer: "Save some energy at the same quality"
    explain: "The boost pushes the card faster than the video encoder can use. Capping it saved energy at the same quality and nearly the same time. Two runs per setting."

upscale-sweetspot-degraded-sources:
  plain_headline: AI upscaling may pay off most on old, low-quality video — and not at all on already-sharp 4K
  plain_summary: >-
    Restoring badly degraded standard-definition video to 4K bought about 20× more quality per
    unit of energy than polishing clean HD. Re-processing pristine 4K bought nothing, at the
    highest energy cost (about 44 Wh per clip).
  key_number: ~20× more quality per Wh
  theme: ai
  tags: [where:server, lever:content, hardware:nvidia-gpu]
  n_runs: 1
  n_note: n=1 per quality rung (14 runs across the ladder)
  stages: [encode, ai]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    AI upscaling is expensive, so where it is applied matters. Spent on old, damaged archive footage it buys a lot of quality; spent on footage that is already sharp it buys none.
  quiz:
    question: "Where may AI upscaling buy the most picture quality for the energy?"
    options: ["Old, low-quality video", "Clean HD video", "Already-sharp 4K video"]
    answer: "Old, low-quality video"
    explain: "Restoring badly degraded video gained far more quality per unit of energy than polishing clean HD. Re-processing pristine 4K gained nothing, at the highest energy cost. One run per quality level."

input-master-sensitivity:
  plain_headline: How big the source file is may make no difference to the energy needed to re-encode it
  plain_summary: >-
    Re-encoding siblings of the same clip at source bitrates from 1.3 to 14.6 Mbps cost the same
    energy within noise. Starting from an AV1 source added about 10% on the graphics card.
  key_number: ≤5% spread
  theme: trust
  tags: [where:server, lever:test-design, lever:bitrate, hardware:amd-gpu, hardware:desktop-cpu, codec:hevc, codec:av1]
  n_runs: 1
  n_note: n=1 per source variant
  stages: [encode, method]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    Labs can compare encode energy without matching the exact source file their peers used. Only the source's format seems to matter, not its size.
  quiz:
    question: "When re-encoding a clip from a bigger source file, what may happen to the energy?"
    options: ["It stays about the same", "It rises with the source size", "It falls"]
    answer: "It stays about the same"
    explain: "Across a wide range of source bitrates the energy was the same within noise. Starting from an AV1 source did add a little on the graphics card. One run per source."

llm-cold-inference-mwh-per-token:
  plain_headline: A bigger AI chat model may use more than ten times the energy per word of a small one
  plain_summary: >-
    Mistral 7B used about 0.96 mWh per token (roughly a word fragment), TinyLlama about 0.07 —
    around 13× apart. Measured on an earlier model panel and graphics card.
  key_number: ~13× per token
  theme: ai
  tags: [where:server, lever:model-size, hardware:amd-gpu]
  n_runs: 1
  n_note: single run per model; small model near the noise floor
  stages: [ai]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    Model size may be the biggest single lever on AI energy. Choosing the smallest model that does the job well could save an order of magnitude, but quality has to be checked too.
  quiz:
    question: "How may a larger AI chat model compare with a small one on energy per word?"
    options: ["It uses far more", "About the same", "It uses less"]
    answer: "It uses far more"
    explain: "On an earlier set of models and graphics card, the larger model used far more energy per token. Single runs, and the small model was near the noise floor."

rag-faithfulness-rem-question:
  plain_headline: In a first test, the smallest AI model made up an answer that larger models got right from the same documents
  plain_summary: >-
    All three models were handed the same correct documents. The 1.1-billion-parameter model
    blended in an unrelated source and invented a framework; the 12B and 14B models stayed
    faithful.
  key_number: 1 of 3 models hallucinated
  theme: ai
  tags: [where:server, lever:model-size, hardware:amd-gpu]
  n_runs: 1
  n_note: n=1 (one question, one run)
  stages: [ai]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    The cheapest AI model is no saving if its answers are wrong. Energy per answer only means something next to a check of the answer.
  quiz:
    question: "Three AI models were handed the same correct documents. In a first test, which made up part of its answer?"
    options: ["The smallest model", "The largest model", "All three"]
    answer: "The smallest model"
    explain: "The smallest blended in an unrelated source and invented a framework. The two larger models stayed faithful. One question, one run."

sd-turbo-cpu-image-first-run:
  plain_headline: A first measurement of the energy it takes to make one AI image on a desktop processor
  plain_summary: >-
    SD-Turbo used about 0.21 Wh to generate one 512×512 image on GoS1's processor (no graphics
    card).
  key_number: 0.21 Wh per image
  theme: ai
  tags: [where:server, hardware:desktop-cpu]
  n_runs: 1
  n_note: n=1
  stages: [ai]
  review_status: lab-checked
  review_note: >-
    Published before the review ladder existed (CR-086). Confirm who checked it, then keep or lower this status.
  why_it_matters: >-
    It gives a first, measured reference point for the energy of one AI image, where most published figures are estimates.
  quiz:
    question: "What does our measurement of one AI image on a desktop processor give you?"
    options: ["A first reference point from one run", "An average for the AI industry", "Proof that processors beat graphics cards"]
    answer: "A first reference point from one run"
    explain: "It is one run of one small model at one image size on one machine. No graphics card was involved, so it says nothing about how the two compare."

# --- Added 2026-11-06 (CR-086): drafts from the October GoS2 campaigns. ---
# apple-m6-encode-energy-vs-ryzen-rtx5080 is deliberately NOT listed: its own
# caveat says its hardware percentages are superseded, and
# encode-energy-levers-nvenc-vs-apple-m6 replaces its framing.

encode-energy-levers-nvenc-vs-apple-m6:
  draft: true
  plain_headline: On an NVIDIA graphics card, the encoder's speed setting can nearly triple the energy for no gain in quality; on an Apple M6, no encoder setting matters
  plain_summary: >-
    Encoding one 4K clip to HD, NVIDIA's slowest preset used up to 2.9× the energy of a faster one at the same
    quality score. On an Apple M6 Mac mini, no encoder setting moved energy by more than about 5 %; only where
    the 4K source was decoded and scaled did. At matched quality the M6 used about 5× less energy above idle.
  key_number: up to 2.9× from one setting
  theme: preparing
  tags: [where:server, lever:settings, lever:hw-vs-sw, hardware:nvidia-gpu, hardware:apple-m6, codec:h264, codec:hevc]
  n_runs: 3
