# Findings taxonomy — the controlled vocabulary behind /findings navigation and search.
#
# DRAFT (2026-10-16): read only by the Marketing-Lab mockup
# (routes_mockup_findings.py) until the redesign is approved; findings.py does
# not validate against it yet.
#
# Shape (SKOS-lite): facet → {label, values: {key → {label, synonyms, definition}}}.
# A finding carries one `theme` and any number of `facet:key` tags.
# Adding a category = add a value here; nothing else changes.
# House rule: add a new value only once 2 findings need it.

theme:
  label: Question
  values:
    where:
      label: Where the energy goes
      question: Where does the energy go when people watch?
      synonyms: [TV, television, screen, display, panel, home, viewing, household, picture mode]
      definition: How the power drawn while watching splits between the screen, the box and the choices around them.
    myths:
      label: Myths tested
      question: Do 4K, HDR, codecs and bitrate really matter?
      synonyms: [4K, UHD, HDR, resolution, codec, bitrate, AV1, HEVC, VP9, myth, claim]
      definition: Common claims about streaming energy, checked against measurements.
    devices:
      label: Devices compared
      question: Which devices make the biggest difference?
      synonyms: [set-top box, STB, TV box, streaming stick, dongle, Raspberry Pi, hardware decoder, chip]
      definition: How much the choice of playback device and its silicon changes the energy.
    preparing:
      label: Preparing video
      question: What does it cost to prepare video for streaming?
      synonyms: [encode, encoding, transcode, compression, ABR ladder, server, NVENC, GPU]
      definition: Energy a server uses to compress and convert video before delivery.
    ai:
      label: AI in media
      question: What does AI add?
      synonyms: [LLM, chatbot, language model, RAG, image generation, upscaling, super-resolution, inference, GenAI]
      definition: Energy used to run AI models on media tasks — text, images and video enhancement.
    trust:
      label: How we measure
      question: Why trust these numbers?
      synonyms: [methodology, method, test design, protocol, reproducibility, repeatability]
      definition: Checks on our own test methods, so other results can be trusted.

where:
  label: Where the energy is used
  values:
    home-device:
      label: Home device
      synonyms: [client, CPE, set-top box, TV box, player]
      definition: The box or computer in the viewer's home (screen excluded unless stated).
    server:
      label: Server
      synonyms: [data centre, datacenter, head-end, cloud]
      definition: The machine that prepares or serves content.

lever:
  label: What makes the difference
  values:
    hw-vs-sw:
      label: Dedicated chip vs general software
      synonyms: [hardware decoder, hardware encoder, GPU, NVENC, VAAPI, software decode, fixed-function]
      definition: Doing the work on a purpose-built chip instead of the main processor.
    codec:
      label: Video format (codec)
      synonyms: [H.264, AVC, HEVC, H.265, AV1, VP9, compression format]
      definition: Which compression format the video uses.
    device-type:
      label: Type of device
      synonyms: [streaming box, Raspberry Pi, general-purpose, STB class]
      definition: The class of device doing the work.
    settings:
      label: Settings
      synonyms: [preset, clock, GPU boost, rate control, overclock, picture mode, eco mode, vivid, brightness]
      definition: How the hardware, encoder or TV is configured.
    bitrate:
      label: Bitrate
      synonyms: [Mb/s, Mbps, data rate, bandwidth, source bitrate, quality level]
      definition: How many bits per second the video uses.
    resolution-hdr:
      label: Resolution and HDR
      synonyms: [4K, UHD, 2160p, HD, 1080p, HDR, HDR10, SDR, dynamic range]
      definition: The picture format — how many pixels and how wide a brightness range.
    content:
      label: What's on screen
      synonyms: [content, animation, live action, complexity, source quality, degraded]
      definition: The video itself — its type, complexity or starting quality.
    model-size:
      label: AI model size
      synonyms: [parameters, small model, large model, TinyLlama, Mistral]
      definition: How big the AI model is.
    test-design:
      label: Test design
      synonyms: [loop, excerpt, source file, protocol]
      definition: Choices in how a test is built.

hardware:
  label: Hardware
  values:
    tv:
      label: TV screen
      synonyms: [LG C2, OLED, television, panel, display]
      definition: The TV the box plays into (an LG C2 55-inch OLED).
    raspberry-pi:
      label: Raspberry Pi
      synonyms: [Pi 400, Pi 5, single-board computer]
      definition: Small general-purpose computer, used as a reference client.
    streaming-box:
      label: Streaming box
      synonyms: [Google TV Streamer, Fire TV Stick, Xiaomi TV Box, set-top box, STB]
      definition: Purpose-built TV streaming device.
    apple-tv:
      label: Apple TV
      synonyms: [A10X, tvOS]
      definition: Apple's streaming box.
    nvidia-gpu:
      label: NVIDIA graphics card
      synonyms: [RTX 5080, NVENC, CUDA]
      definition: GoS1's current graphics card (RTX 5080).
    amd-gpu:
      label: AMD graphics card
      synonyms: [RX 7800 XT, VAAPI, Radeon]
      definition: GoS1's graphics card until 2026-05-29.
    desktop-cpu:
      label: Desktop processor
      synonyms: [CPU, Ryzen 9 7900, software]
      definition: GoS1's main processor.

codec:
  label: Video format
  values:
    h264:
      label: H.264
      synonyms: [AVC]
      definition: The most widely supported video format.
    hevc:
      label: HEVC
      synonyms: [H.265]
      definition: Successor to H.264; about half the bitrate for the same quality.
    av1:
      label: AV1
      synonyms: [AOMedia]
      definition: Royalty-free format from the Alliance for Open Media.
    vp9:
      label: VP9
      synonyms: [Google]
      definition: Google's royalty-free format, widely used on YouTube.
