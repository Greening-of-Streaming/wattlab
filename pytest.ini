[pytest]
# CR-068: pin the async test mode so runs are reproducible across machines
# (pytest-asyncio's default has shifted between releases). The async tests
# already carry explicit @pytest.mark.asyncio, which is exactly strict mode.
#
# The suite is run from wattlab_service/ (see TESTING.md); conftest.py there
# puts the package on sys.path. No testpaths override here — that would change
# the working invocation and the cwd-relative StaticFiles mount assumption.
asyncio_mode = strict
